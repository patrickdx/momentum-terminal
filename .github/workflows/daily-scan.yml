name: Daily scan & publish

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'tests/**']
  workflow_dispatch:
  schedule:
    - cron: '17 23 * * *'

concurrency:
  group: momentum-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      scan-outcome: ${{ steps.scan.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check scoring and parsing
        run: python -m unittest discover -s tests -v
      - name: Collect market snapshots
        id: scan
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/scan.py --enrich 15
      - name: Validate published assets
        run: |
          node --check site/app.js
          python scripts/validate.py
      - name: Retain daily snapshots in the repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/latest.json site/data/history.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: update daily momentum snapshot'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish terminal
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report degraded market scan after publishing source status
        if: needs.scan.outputs.scan-outcome == 'failure'
        run: |
          echo 'One or more market scans failed. The published terminal preserves the last successful data and displays its original timestamp.'
          exit 1
